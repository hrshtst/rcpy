[project]
name = "rcpy"
version = "0.2.0"
description = "Reservoir computing framework integrated with Taichi Lang"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Hiroshi Atsuta", email = "atsuta@ieee.org" }
]
maintainers = [
    { name = "Hiroshi Atsuta", email = "atsuta@ieee.org" },
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "omegaconf>=2.3.0",
    "pandas>=2.3.2",
    "pyqt6>=6.9.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "taichi>=1.7.4",
]
license = {text = "MIT"}
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hrshtst/rcpy"
Repository = "https://github.com/hrshtst/rcpy"
Issues = "https://github.com/hrshtst/rcpy/issues"
Discussions = "https://github.com/hrshtst/rcpy/discussions"

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "nox>=2025.5.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-randomly>=3.16.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.10",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ git = { commit = true, tags = true } }]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "examples/old",
    "src/rcpy/old",
    "tests/old",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# select = ["E4", "E7", "E9", "F"]
select = ["ALL"]
ignore = [
  "D1",                         # Ignore missing docstring (remove in future)
  "N802",                       # Ignore function names that do not follow 'snake_case'
  "N803",                       # Ignore argument names that do not follow 'snake_case'
  "N806",                       # Ignore variable names with non-lowercase
  "N815",                       # Ignore class variable names that follow 'mixedCase'
  "PLR0913",                    # Ignore many arguments in function definition
  "RET504",                     # Ignore unnecessary assignment immediately precede a return
  "SIM108",                     # Ignore using ternary operator {contents} instead of if-else-block
  "S101",                       # Ignore detection of using assert
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = [
  "SIM105",                     # Avoid inadvertently fix try-except-pass clause
  "T201",                       # Avoid inadvertently removing `print` statements
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
# Use Numpy-style docstrings.
convention = "numpy"

[tool.ruff.lint.pylint]
# Maximum number of arguments allowed for a function or method
# definition (see PLR0913).
max-args = 20                   # Default: 5

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --ignore=tests/old"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serious",
]

[tool.pyright]
include = ["src", "tests", "examples"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
venvPath = "."
venv = ".venv"

[tool.mypy]
files = ["src", "tests", "examples"]
python_executable = ".venv/bin/python"
check_untyped_defs = true       # Type-checks the interior of functions without type annotations.

[[tool.mypy.overrides]]
module = [
  "numpy.*",
  "scipy.*",
  "matplotlib.*",
  "pandas.*",
  "seaborn.*",
  "taichi.*",
]
ignore_missing_imports = true

